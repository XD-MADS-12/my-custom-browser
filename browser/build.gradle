plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mybrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.mybrowser.custom"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Enable multidex for extensions
        multiDexEnabled true
        
        // Custom config
        buildConfigField "boolean", "ENABLE_EXTENSIONS", "true"
        buildConfigField "boolean", "ENABLE_DEVTOOLS", "true"
        buildConfigField "String", "VERSION_NAME", "\"1.0-extensions\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "DEBUG", "false"
        }
        debug {
            buildConfigField "boolean", "DEBUG", "true"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        buildConfig true
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.chromium.crux:crux:1.0.0' // For extension support
}
