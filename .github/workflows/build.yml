name: Build Custom Browser APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: List APK files
      run: |
        find . -name "*.apk" -type f
        ls -lh browser/build/outputs/apk/

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: browser-debug-apk
        path: browser/build/outputs/apk/debug/browser-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: browser-release-apk
        path: browser/build/outputs/apk/release/browser-release-unsigned.apk
        retention-days: 30
